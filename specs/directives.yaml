version: "15.2"
description: Shared directives for Core Networking Manager.
directives:
  - id: E-9300.0
    dos:
      - Keep maintained code, documentation, and specifications aligned.
      - Keep component requirements in their focused specification files.
      - Use native ESM and supported Node.js versions for maintained modules.
      - Add focused tests for maintained behavior changes.
      - Run the aggregate validation before handoff or release.
      - Use the approved npm publication workflow for releases.
    donts:
      - Do not publish unfinished package versions.
      - Do not commit credentials, private data, or runtime state.
