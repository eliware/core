version: "15.2"
description: Requirements for the router web application and deployment webhook.
directives:
  - id: E-9300.2
    dos:
      - Run a separate web application on each managed router.
      - Run the read-only dashboard on `PORT` and the webhook listener on `WEBHOOK_PORT`.
      - Use the loopback interface for the dashboard and webhook listeners.
      - Route external dashboard and webhook traffic through a proxy to loopback.
      - Allow proxied dashboard access from approved clients only.
      - Set the webhook listener to use the loopback interface.
      - Set a distinct webhook port for each server.
      - Require distinct dashboard and webhook ports.
      - Read the GitHub webhook secret from the router environment file.
      - Read the repository location from the router environment file.
      - Read the Discord webhook URL from the router environment file.
      - Keep environment files and secret values out of Git.
      - Authenticate each GitHub webhook before processing its deployment.
      - Run `git pull` before deployment validation.
      - Run `npm ci --include=dev` after `git pull` succeeds.
      - Run `npm test` after dependency installation succeeds.
      - Run `npm run preflight` after tests pass.
      - Run catalog actions or `npm run reload` only after all earlier deployment steps pass.
      - Stop the deployment sequence when any step fails.
      - Restore the previous commit without reloading applications when an earlier step fails.
      - Restore the previous commit and reload its configuration when `npm run reload` fails.
      - Restore the previous commit and replay affected catalog actions when a catalog action fails.
      - Send Discord notifications for deployment success and failure.
      - Use decimal deployment identifiers from `@eliware/common` snowflakes.
      - Use a unique snowflake worker and process pair for each active application instance.
      - Check configured essential applications every five minutes.
      - Send a Discord notification when an essential application is unhealthy.
      - Provide a graphical, single-page, read-only health dashboard.
      - Show current health for each configured essential application.
      - Let administrators deploy to each server independently.
    donts:
      - Do not change router configuration through the dashboard.
      - Do not reload applications after an earlier deployment step fails.
      - Do not start a deployment with an unauthenticated webhook.
      - Do not expose the webhook listener on all network interfaces.
      - Do not store credentials or webhook secrets in Git.
